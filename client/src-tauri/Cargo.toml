[package]
name = "plan-gestor-task"
# Mantener igual que client/package.json (tauri.conf.json toma la versión de ahí).
version = "1.3.0"
description = "Plan Gestor Task: tareas, hábitos, calendario, notas y finanzas, local-first"
authors = ["Alejandro Dukesini"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "plan_gestor_task_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
