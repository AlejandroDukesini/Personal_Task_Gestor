# La app es 100% estática (local-first, los datos viven en el navegador), así que
# Netlify solo construye el paquete `client`. El `server` de Express no se despliega.
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# El enrutado lo maneja React Router en el cliente.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Cabeceras de seguridad (se aplican a todas las respuestas del sitio).
#
# Al ser una SPA estática, estas cabeceras son la única capa de defensa del
# perímetro: no hay servidor propio donde aplicarlas. Cada valor está elegido
# para no romper la app tal y como está construida hoy.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # Content-Security-Policy: reduce el impacto de un XSS a un fallo inerte.
    #   script-src 'self'      -> el build de Vite solo emite scripts externos;
    #                             no hay inline JS (el bloque JSON-LD no es
    #                             ejecutable y CSP no lo bloquea).
    #   style-src 'unsafe-inline' -> obligatorio: framer-motion, recharts y
    #                             FullCalendar escriben atributos style en línea.
    #                             Es el punto débil aceptado de esta política.
    #   img-src data: blob:    -> el logo de la app se guarda como data URL y las
    #                             exportaciones JSON/CSV usan blob:.
    #   connect-src            -> solo la integración opcional que el usuario
    #                             activa: API de Google Calendar
    #                             (www.googleapis.com). El motor de OCR y sus
    #                             datos se sirven desde la propia app (/ocr/).
    #   script-src             -> Google Identity Services (OAuth);
    #                             'wasm-unsafe-eval' permite compilar el
    #                             WebAssembly del OCR (no habilita eval de JS).
    #   font-src               -> Inter va incluida en el build (@fontsource).
    #   frame-src              -> ventana/iframe de autorización de Google.
    #   frame-ancestors 'none' -> anti-clickjacking.
    #   base-uri 'none'        -> impide reescribir rutas relativas vía <base>.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https://www.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

    # Anti-clickjacking heredado, para navegadores sin frame-ancestors.
    X-Frame-Options = "DENY"

    # Impide que el navegador adivine el MIME (XSS por content sniffing).
    X-Content-Type-Options = "nosniff"

    # App de datos personales: no filtrar la URL visitada a terceros.
    Referrer-Policy = "no-referrer"

    # Mínimo privilegio sobre las APIs del navegador: la app no usa ninguna.
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()"

    # Fuerza HTTPS durante un año (Netlify ya sirve TLS en todo el dominio).
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # Aísla la ventana de contextos de origen cruzado. `allow-popups` es el
    # mínimo que exige la ventana de autorización de Google (OAuth) para
    # devolver el resultado a la app.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "same-origin"

# El HTML no debe cachearse: garantiza que un despliegue con cabeceras o
# correcciones de seguridad nuevas llegue al usuario de inmediato.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
